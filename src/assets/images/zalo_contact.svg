<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1050" height="360" viewBox="0 0 1050 360">
    <defs>
      <style>
        .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 23px; font-weight: 800; fill: #0f172a; }
        .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #64748b; }
        .sec-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; }
        .info-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14.5px; font-weight: 500; fill: #334155; }
        .phone-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0068ff; }
        .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
        .qr-caption { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #475569; text-anchor: middle; }
      </style>
      <filter id="card-shadow" x="-2%" y="-5%" width="104%" height="115%">
        <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05" />
      </filter>
    </defs>

    <!-- Background Card -->
    <rect x="6" y="6" width="1038" height="348" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />

    <!-- ================= LEFT COLUMN ================= -->
    <!-- Avatar Group -->
    <g transform="translate(40, 36)">
      <!-- Avatar Outer Circle -->
      <circle cx="42" cy="42" r="42" fill="#f5f2ea" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- 3 Colored Shapes inside Avatar -->
      <g transform="translate(10, 14)">
        <!-- Orange Left -->
        <rect x="2" y="8" width="24" height="32" rx="10" fill="#de5d43" opacity="0.9" transform="rotate(-10 14 24)" />
        <!-- Blue Center -->
        <rect x="18" y="6" width="28" height="36" rx="10" fill="#3770b8" opacity="0.9" />
        <!-- Green Right -->
        <rect x="36" y="8" width="24" height="32" rx="10" fill="#4ea452" opacity="0.9" transform="rotate(10 48 24)" />
        
        <!-- White Frosted Overlay for text readability -->
        <rect x="0" y="12" width="64" height="28" rx="6" fill="#ffffff" opacity="0.84" stroke="#94a3b8" stroke-width="0.5" />
        <text x="32" y="19" font-family="sans-serif" font-size="4.5" font-weight="800" fill="#1e293b" text-anchor="middle">TRUNG TÂM DỊCH VỤ</text>
        <text x="32" y="28" font-family="sans-serif" font-size="8.5" font-weight="900" fill="#0068ff" text-anchor="middle">SHOP SSC</text>
        <text x="32" y="36" font-family="sans-serif" font-size="3.8" font-weight="700" fill="#334155" text-anchor="middle">(FPT RETAIL &amp; LONG CHÂU)</text>
      </g>
    </g>

    <!-- Name & Badges -->
    <text x="144" y="64" class="title">Trung tâm SSC FPT RETAIL</text>
    
    <!-- Verified Golden Badge -->
    <g transform="translate(458, 46)">
      <circle cx="11" cy="11" r="11" fill="#eab308" />
      <path d="M6.5 11 L9.5 14 L15.5 7.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Subtitle Category -->
    <text x="144" y="94" class="sub">Mua sắm &amp; Bán lẻ</text>

    <!-- Nhắn tin Button -->
    <g transform="translate(144, 116)">
      <rect width="164" height="42" rx="12" fill="#0068ff" />
      <!-- Message Icon with smiley -->
      <g transform="translate(18, 12)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1a6 6 0 0 1-6 6H7l-4 3V8z" />
        <path d="M6.5 8.5c.8.8 2.2.8 3 0" />
      </g>
      <text x="72" y="26" class="btn-text">Nhắn tin</text>
    </g>

    <!-- Section: Thông tin chi tiết -->
    <text x="40" y="214" class="sec-title">Thông tin chi tiết</text>

    <!-- Address Row -->
    <g transform="translate(40, 232)">
      <!-- Map Pin Icon -->
      <g transform="translate(0, 0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 1a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6z" />
        <circle cx="10" cy="7" r="2" />
      </g>
      <text x="30" y="13" class="info-text">210 Bùi Văn Ba, Tân Thuận Đông, Phường Tân Thuận, Thành phố Hồ Chí Minh</text>
    </g>

    <!-- Phone Row -->
    <g transform="translate(40, 266)">
      <!-- Phone Receiver Icon -->
      <g transform="translate(0, 0)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 11.5v2.5a2 2 0 0 1-2.18 2 15.86 15.86 0 0 1-6.9-2.45 15.5 15.5 0 0 1-4.8-4.8A15.86 15.86 0 0 1-1.33 2.18 2 2 0 0 1 .65 0h2.5a2 2 0 0 1 2 1.72 10.3 10.3 0 0 0 .56 2.11 2 2 0 0 1-.45 2.11L4.2 7.02a12.8 12.8 0 0 0 4.8 4.8l1.08-1.06a2 2 0 0 1 2.11-.45 10.3 10.3 0 0 0 2.11.56 2 2 0 0 1 1.7 2.13z" transform="translate(2, 2)" />
      </g>
      <text x="30" y="14" class="phone-text">0902422712</text>
    </g>

    <!-- Divider Vertical -->
    <line x1="740" y1="32" x2="740" y2="328" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- ================= RIGHT COLUMN: QR CODE ================= -->
    <g transform="translate(775, 26)">
      <!-- QR Image Frame -->
      <image href="data:image/png;base64," x="10" y="10" width="215" height="215" />

      <!-- Zalo Center Logo -->
      <g transform="translate(96, 96)">
        <rect x="0" y="0" width="44" height="40" rx="9" fill="#000000" stroke="#ffffff" stroke-width="2.5" />
        <text x="22" y="25" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">Zalo</text>
      </g>

      <!-- Text under QR -->
      <text x="117" y="270" class="qr-caption">Mở Zalo, bấm quét QR để quét và</text>
      <text x="117" y="288" class="qr-caption">xem trên điện thoại</text>
    </g>
  </svg>