      <rect x="0" y="224" width="410" height="24" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="240" fill="#8c8c8c" font-size="11">16/05/2024</text>

      <!-- Field 13: Ky hieu hoa don -->
      <text x="0" y="262" fill="#bfbfbf" font-size="11">Ký hiệu hoá đơn</text>
      <rect x="0" y="268" width="410" height="24" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="284" fill="#8c8c8c" font-size="11">1C24MHC</text>
    </g>

    <!-- BOTTOM ACTION BUTTONS BAR -->
