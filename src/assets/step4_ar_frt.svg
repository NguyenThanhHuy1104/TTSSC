      <rect x="0" y="128" width="410" height="26" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="145" fill="#8c8c8c" font-size="11">3600432744</text>

      <!-- Field 11: Xuat hang tai kho -->
      <text x="0" y="170" fill="#bfbfbf" font-size="11">Xuất hàng tại kho</text>
      <rect x="0" y="176" width="410" height="26" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="193" fill="#8c8c8c" font-size="11">81163</text>

      <!-- Field 12: Ngay hoan tat -->
