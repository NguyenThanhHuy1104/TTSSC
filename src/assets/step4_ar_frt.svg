      <path d="M8 20 C8 15, 20 15, 20 20" stroke="#8c8c8c" stroke-width="1.5" fill="none"/>
      <circle cx="14" cy="11" r="3.5" fill="#8c8c8c"/>

      <text x="32" y="10" fill="#262626" font-size="11" font-weight="700">46765 - Vương Uyển Đình</text>
      <text x="165" y="10" fill="#1890ff" font-size="10">https://duocquocgia.com.vn</text>
      <text x="32" y="24" fill="#595959" font-size="10">80000 - HO</text>
      <text x="110" y="24" fill="#8c8c8c" font-size="10">Chưa có Tài khoản Dược Quốc gia</text>

      <rect x="222" y="-2" width="38" height="22" rx="3" fill="#52c41a"/>
      <text x="241" y="8" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">PROD</text>
