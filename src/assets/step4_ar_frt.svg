  <!-- Logo FPT -->
  <g transform="translate(10, 12)">
    <rect x="0" y="0" width="8" height="18" fill="#f26522" rx="1"/>
    <rect x="10" y="0" width="8" height="18" fill="#00a859" rx="1"/>
    <rect x="20" y="0" width="8" height="18" fill="#0072bc" rx="1"/>
  </g>

  <!-- Sidebar Nav Icons -->
  <g transform="translate(14, 50)">
    <path d="M4 12 L10 6 L16 12 V18 H13 V14 H7 V18 H4 Z" fill="#ffffff" opacity="0.6"/>
  </g>
  <g transform="translate(14, 85)">
    <path d="M4 3 H13 L17 7 V19 H4 Z M12 3 V8 H17" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>
  <g transform="translate(14, 120)">
