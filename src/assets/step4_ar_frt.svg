      <!-- Field 8: So dien thoai doanh nghiep -->
      <text x="0" y="10" fill="#bfbfbf" font-size="11">Số điện thoại doanh nghiệp</text>
      <rect x="0" y="16" width="410" height="26" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
