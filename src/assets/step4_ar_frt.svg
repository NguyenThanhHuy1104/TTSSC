      <rect x="219" y="0" width="70" height="26" rx="3" fill="#f5f5f5" stroke="#d9d9d9" stroke-width="1"/>
      <text x="254" y="17" fill="#bfbfbf" font-size="11" text-anchor="middle">Hoàn tất</text>
