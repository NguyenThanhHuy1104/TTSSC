      <rect x="0" y="224" width="400" height="24" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="240" fill="#8c8c8c" font-size="11">16/05/2024</text>

      <!-- Field 6: So giao dich phat sinh -->
      <text x="0" y="262" fill="#bfbfbf" font-size="11">Số giao dịch phát sinh</text>
      <rect x="0" y="268" width="400" height="24" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="284" fill="#8c8c8c" font-size="11">00095485</text>

      <!-- Field 7: Ly do dieu chinh hoa don -->
      <text x="0" y="300" fill="#bfbfbf" font-size="11">Lý do điều chỉnh hoá đơn</text>
      <rect x="0" y="306" width="400" height="20" rx="2" fill="#f0f0f0" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="319" fill="#8c8c8c" font-size="9">3013923000 - Sai Tên người mua. Tên người mua đúng là " %3013923000 - Sai Tên đơn vị người mua...</text>
    </g>

    <!-- RIGHT COLUMN EDITABLE FORM -->
