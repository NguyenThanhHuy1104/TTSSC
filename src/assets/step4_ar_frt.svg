      <rect x="0" y="64" width="410" height="42" rx="2" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
      <text x="10" y="82" fill="#262626" font-size="10" font-weight="500">01, KP 1, đường Nguyễn Ái Quốc, Phường Tân Hiệp, Thành phố Biên Hòa, Tỉnh Đồng Nai.</text>

      <!-- Field 10: Ma so thue -->
